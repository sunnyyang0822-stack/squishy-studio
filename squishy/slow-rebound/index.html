<!doctype html>
<html lang="zh-CN" data-theme="day">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f9f3f4" />
  <script src="/theme-preference.js"></script>
  <title>慢回弹圆球｜Squishy Studio</title>
  <meta name="description" content="慢慢压下，慢慢回弹。驻留时柔和下陷，滑动留下浅痕，松开后完整恢复。" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/detail/detail.css" />
  <script type="module" src="/detail/page.js"></script>
</head>
<body class="detail-page">
  <header class="detail-topbar">
    <a class="detail-back" href="/squishy/cloud/"><span aria-hidden="true">←</span> 体验黏土</a>
    <a class="detail-brand" href="/">Squishy Studio</a>
  </header>
  <main class="detail-main">
    <div class="toy-heading"><span class="preview-badge">加载中</span><h1>慢回弹圆球</h1><p>慢慢压下，松开完整回弹。驻留压深，滑过留浅痕。</p></div>
    <div class="toy-stage" id="toy-stage" role="region" aria-label="慢回弹圆球展示区" aria-busy="true">
      <div class="toy-halo" aria-hidden="true"></div>
      <div class="toy-mount" data-feel-id="slow-rebound"></div>
      <div class="resource-message"><p class="resource-status" role="status">正在加载圆球…</p><button class="retry-button" type="button" hidden>重新加载</button></div>
    </div>
    <section class="customization" aria-label="圆球颜色">
      <fieldset class="color-picker"><legend>挑个喜欢的颜色</legend><div class="color-options"></div></fieldset>
      <output class="configuration-summary sr-only" aria-live="polite">已选择：奶油粉</output>
      <p class="configuration-error" role="status" hidden></p>
    </section>
    <noscript><p class="no-script">请启用 JavaScript 以加载圆球和选择颜色；仍可通过上方导航返回。</p></noscript>
  </main>
</body>
