<!doctype html>
<html lang="zh-CN" data-theme="day">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f9f3f4" />
    <script src="/theme-preference.js"></script>
    <title>合集大厅｜Squishy Studio</title>
    <meta name="description" content="选择奶油圆球，制作自己的捏捏。更多样式正在准备中。" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/showcase.css" />
  </head>
  <body class="hall-page">
    <header class="hall-topbar">
      <a class="hall-brand" href="/#samples">Squishy Studio</a>
      <a class="hall-back" href="/#samples"><span aria-hidden="true">←</span> 返回首页样例</a>
    </header>
    <main class="hall-main">
      <h1>合集大厅</h1>
      <p class="hall-intro">挑个样式</p>
      <section class="collection-ready" aria-labelledby="orb-style">
        <div class="orb-style-preview" aria-hidden="true"></div>
        <div>
          <span class="pending-status">可制作</span>
          <h2 id="orb-style">奶油圆球</h2>
          <a class="hall-back" href="/squishy/cloud/?style=orb">开始制作 <span aria-hidden="true">→</span></a>
        </div>
      </section>
      <article class="collection-pending" aria-labelledby="first-collection">
        <img src="/assets/samples/cloud.svg" width="320" height="320" alt="圆润的奶油小云样例" />
        <div>
          <span class="pending-status">制作中</span>
          <h2 id="first-collection">柔软的一刻</h2>
          <p>第一组脆皮捏捏正在制作中。<br />准备好了，再来慢慢挑。</p>
        </div>
      </article>
      <a class="hall-back hall-return" href="/#samples"><span aria-hidden="true">←</span> 回去看看样例</a>
    </main>
  </body>
</html>
