name: 首页验证

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run real WebGL tests with full Chromium
        # Match local Chrome/Edge's new headless mode instead of headless shell.
        run: |
          export PLAYWRIGHT_BROWSER_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          npm test
