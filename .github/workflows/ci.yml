name: 首页验证

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-shards:
    name: browser-shard (${{ matrix.shard }}/6)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run real WebGL tests with full Chromium
        env:
          # Only thin-wax browser tests read this; preserve CSS size and real clocks.
          THIN_WAX_TEST_DPR: "0.5"
        # Match local Chrome/Edge's new headless mode instead of headless shell.
        run: |
          export PLAYWRIGHT_BROWSER_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          npm run build
          files=(tests/*.test.cjs)
          general=()
          for file in "${files[@]}"; do
            if [[ "$file" != tests/squishy-styles-browser.test.cjs && "$file" != tests/squishy-marshmallow-browser.test.cjs && "$file" != tests/squishy-slow-rebound-browser.test.cjs ]]; then
              general+=("$file")
            fi
          done
          node --test --test-concurrency=1 --test-shard=${{ matrix.shard }}/6 "${general[@]}"

  style-cases:
    name: style-case (${{ matrix.case }})
    strategy:
      fail-fast: false
      matrix:
        case: [cloud, paw, cylinder, donut, pyramid, flower, star, loading-race, cloud-marshmallow, paw-marshmallow, cylinder-marshmallow, donut-marshmallow, pyramid-marshmallow, flower-marshmallow, star-marshmallow, cloud-slow-rebound, paw-slow-rebound, cylinder-slow-rebound, donut-slow-rebound, pyramid-slow-rebound, flower-slow-rebound, star-slow-rebound, slow-rebound-touch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run exactly one original style browser test
        run: |
          export PLAYWRIGHT_BROWSER_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          npm run build
          node scripts/run-style-ci-case.cjs "${{ matrix.case }}"

  browser-tests:
    name: browser-tests
    needs: [browser-shards, style-cases]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard to succeed
        run: |
          test "${{ needs.browser-shards.result }}" = success
          test "${{ needs.style-cases.result }}" = success
